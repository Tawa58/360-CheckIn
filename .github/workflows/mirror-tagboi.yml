name: Mirror to tagboi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-to-tagboi
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'Tawa58/360-CheckIn'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to tagboiityrn-collab/checkIn-360
        env:
          MIRROR_TOKEN: ${{ secrets.CHECKIN360_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "Add repository secret CHECKIN360_MIRROR_TOKEN on Tawa58/360-CheckIn."
            exit 1
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          if ! git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/tagboiityrn-collab/checkIn-360.git" "HEAD:refs/heads/main"; then
            echo "Git rejected CHECKIN360_MIRROR_TOKEN."
            echo "Use a classic PAT with both repo and workflow scopes."
            echo "workflow is required so the mirror can update .github/workflows files."
            exit 1
          fi
