name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'Tawa58/360-CheckIn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Firebase secrets
        id: firebase
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping APK build. Add VITE_FIREBASE_* repository secrets on Tawa58/360-CheckIn."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.firebase.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        if: steps.firebase.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: steps.firebase.outputs.skip != 'true'
        with:
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: Write .env for the release bundle
        if: steps.firebase.outputs.skip != 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GEOFENCE_ID: ${{ secrets.VITE_GEOFENCE_ID }}
          VITE_GEOFENCE_NAME: ${{ secrets.VITE_GEOFENCE_NAME }}
          VITE_GEOFENCE_LAT: ${{ secrets.VITE_GEOFENCE_LAT }}
          VITE_GEOFENCE_LNG: ${{ secrets.VITE_GEOFENCE_LNG }}
          VITE_GEOFENCE_RADIUS: ${{ secrets.VITE_GEOFENCE_RADIUS }}
        run: |
          {
            echo "VITE_USE_FIREBASE_EMULATOR=false"
            echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY"
            echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN"
            echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID"
            echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID"
            echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"
            echo "VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID"
            echo "VITE_GEOFENCE_ID=${VITE_GEOFENCE_ID:-office}"
            echo "VITE_GEOFENCE_NAME=${VITE_GEOFENCE_NAME:-Company premises}"
            echo "VITE_GEOFENCE_LAT=${VITE_GEOFENCE_LAT:--17.878626}"
            echo "VITE_GEOFENCE_LNG=${VITE_GEOFENCE_LNG:-30.675888}"
            echo "VITE_GEOFENCE_RADIUS=${VITE_GEOFENCE_RADIUS:-120}"
          } > .env

      - if: steps.firebase.outputs.skip != 'true'
        run: npm ci

      - name: Build release APK
        if: steps.firebase.outputs.skip != 'true'
        working-directory: android
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_USE_FIREBASE_EMULATOR: 'false'
          VITE_GEOFENCE_ID: ${{ secrets.VITE_GEOFENCE_ID }}
          VITE_GEOFENCE_NAME: ${{ secrets.VITE_GEOFENCE_NAME }}
          VITE_GEOFENCE_LAT: ${{ secrets.VITE_GEOFENCE_LAT }}
          VITE_GEOFENCE_LNG: ${{ secrets.VITE_GEOFENCE_LNG }}
          VITE_GEOFENCE_RADIUS: ${{ secrets.VITE_GEOFENCE_RADIUS }}
        run: |
          chmod +x gradlew
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          {
            echo "sdk.dir=$SDK_DIR"
            echo "ndk.dir=$SDK_DIR/ndk/27.1.12297006"
          } > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Stage APK
        if: steps.firebase.outputs.skip != 'true'
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/CheckIn360.apk

      - uses: actions/upload-artifact@v4
        if: steps.firebase.outputs.skip != 'true'
        with:
          name: CheckIn360-android
          path: dist-apk/CheckIn360.apk

      - uses: softprops/action-gh-release@v2
        if: steps.firebase.outputs.skip != 'true'
        with:
          tag_name: android-latest
          name: CheckIn360 Android
          files: dist-apk/CheckIn360.apk
          make_latest: true
          body: |
            Sideload this APK on employee phones.
            Admin stays on the Vercel website.
